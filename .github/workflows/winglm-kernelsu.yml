name: LG Wing KernelSU-Next Build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Kernel source ref to build"
        required: true
        default: "f16d8d7345901bb1933f25acedeb60c07cf0d2bb"
  push:
    branches:
      - ksunext-winglm-ci
    paths:
      - ".github/workflows/winglm-kernelsu.yml"

permissions:
  contents: read

concurrency:
  group: winglm-kernelsu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || 'f16d8d7345901bb1933f25acedeb60c07cf0d2bb' }}
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libelf-dev libssl-dev lld llvm clang gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu python3 python-is-python3 cpio rsync pahole
          clang --version
          ld.lld --version

      - name: Integrate KernelSU-Next legacy mode
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/legacy/kernel/setup.sh \
            -o /tmp/ksunext-setup.sh
          bash /tmp/ksunext-setup.sh legacy
          KSU_SEPOLICY=drivers/kernelsu/selinux/sepolicy.c
          test -f "$KSU_SEPOLICY"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("drivers/kernelsu/selinux/sepolicy.c")
          s = p.read_text()
          old = "#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 0, 0)"
          new = "#if LINUX_VERSION_CODE < KERNEL_VERSION(4, 10, 0)"
          count = s.count(old)
          if count < 3:
              raise SystemExit(f"Expected at least 3 legacy avtab guards, found {count}")
          p.write_text(s.replace(old, new))
          print(f"Adjusted {count} avtab guards for Linux 4.19 flex_array layout")
          PY
          curl -fL --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/almwld/android_kernel_lge_sm7250/ksunext-winglm-ci/scripts/ci/patch-kernelsu-legacy.py \
            -o /tmp/patch-kernelsu-legacy.py
          python3 /tmp/patch-kernelsu-legacy.py
          grep -n -E 'KERNEL_VERSION\((4, 10|5, 0), 0\)' "$KSU_SEPOLICY" || true
          test -d KernelSU || test -d KernelSU-Next || test -d drivers/kernelsu
          git status --short

      - name: Configure LG Wing kernel
        shell: bash
        run: |
          set -euxo pipefail
          test -f arch/arm64/configs/vendor/winglm-perf_defconfig
          mkdir -p out
          make O="$PWD/out" ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- vendor/winglm-perf_defconfig
          CONFIG_TOOL=scripts/config
          test -x "$CONFIG_TOOL"
          "$CONFIG_TOOL" --file out/.config --enable ANDROID
          "$CONFIG_TOOL" --file out/.config --enable ANDROID_VENDOR_HOOKS
          "$CONFIG_TOOL" --file out/.config --enable KPROBES
          "$CONFIG_TOOL" --file out/.config --enable KSU
          "$CONFIG_TOOL" --file out/.config --disable KSU_MANUAL_HOOK
          "$CONFIG_TOOL" --file out/.config --disable KSU_KPROBES_HOOK
          "$CONFIG_TOOL" --file out/.config --enable KSU_SYSCALL_TABLE_HOOK
          make O="$PWD/out" ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KPROBES=y$' out/.config
          grep -q '^CONFIG_KSU_SYSCALL_TABLE_HOOK=y$' out/.config
          grep -q '^CONFIG_ANDROID_VENDOR_HOOKS=y$' out/.config
          ! grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' out/.config
          grep -q '^CONFIG_MACH_LITO_WINGLM=y$' out/.config

      - name: Build kernel and device trees
        shell: bash
        run: |
          set -o pipefail
          make -j"$(nproc)" O="$PWD/out" ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- Image.gz 2>&1 | tee build.log

      - name: Verify outputs and collect diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          cp build.log artifacts/ 2>/dev/null || true
          cp out/.config artifacts/kernel.config 2>/dev/null || true
          cp out/arch/arm64/boot/Image artifacts/Image 2>/dev/null || true
          cp out/arch/arm64/boot/Image.gz artifacts/Image.gz 2>/dev/null || true
          find out/arch/arm64/boot/dts -type f \( -name '*.dtb' -o -name '*.dtbo' \) -exec cp --parents {} artifacts/ \; 2>/dev/null || true
          if [ -s artifacts/Image.gz ] && grep -q '^CONFIG_KSU=y$' artifacts/kernel.config; then
            sha256sum artifacts/Image.gz > artifacts/SHA256SUMS
            echo "Kernel image and CONFIG_KSU=y verified."
          else
            echo "Kernel image or CONFIG_KSU=y missing; build is not ready." >&2
            exit 1
          fi

      - name: Upload kernel build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winglm-kernelsu-next-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
